name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l assets cmd internal tools platform 2>/dev/null || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: Audit cgo
        run: make no-cgo-audit
      - name: Cross-build and cross-test-compile with cgo disabled
        run: make cross-build cross-test-compile
      - name: Assemble portable Windows and Linux packages
        run: make portable-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blur-portable
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runtime support is still being validated (hazcod/blur#6);
    # its failures are reported but do not block the workflow yet.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests with cgo disabled
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'
          BLUR_REQUIRE_DBUS_FIXTURE: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - name: Race tests
        # The race detector needs a C toolchain, so it is skipped on Windows.
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
        env:
          BLUR_REQUIRE_DBUS_FIXTURE: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - name: Build and test Safari extension
        if: runner.os == 'macOS'
        run: make safari-extension-test

  lint:
    name: Lint
    # Advisory until the golangci-lint backlog is cleared (hazcod/blur#7).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config .github/golangci.yml
