name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...

  cross-build:
    name: Cross-build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build supported targets
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            IFS=/ read -r GOOS GOARCH <<< "$target"
            echo "Building $GOOS/$GOARCH"
            GOOS="$GOOS" GOARCH="$GOARCH" go build ./...
          done
