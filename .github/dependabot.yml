version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels: [dependencies]
    # Vendored dependencies: Dependabot runs `go mod vendor`, which overwrites
    # the local patch documented in docs/vendor-patches.md. Re-apply the patch
    # (see that file) before merging any goui update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels: [dependencies]
  # Add an npm entry for /platform/macos/SafariExtension only if a package.json
  # is introduced there; none exists today.
