version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels: [dependencies]
    # github.com/golang-gui/goui and github.com/lpintes/walk are replaced by
    # forks (see docs/dependency-forks.md); Dependabot cannot bump a replaced
    # module, so those two are updated by hand until the upstream PRs merge.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels: [dependencies]
  # Add an npm entry for /platform/macos/SafariExtension only if a package.json
  # is introduced there; none exists today.
