# GoReleaser configuration (GoReleaser v2).
# Builds the portable Windows and Linux archives. The macOS universal app is
# built, signed and notarized separately by the `macos` job in
# .github/workflows/release.yml and attached to the same GitHub release.
# Tags must be semantic versions with a leading "v" (vX.Y.Z[-prerelease]).
version: 2

project_name: blur

before:
  hooks:
    - go vet ./cmd/...
# Shared build settings, repeated per build because GoReleaser has no anchors
# for build blocks. All binaries are cgo-free.
builds:
  - id: blur-linux
    main: ./cmd/blur
    binary: blur
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

  # Windows GUI binary (no console window).
  - id: blur-windows
    main: ./cmd/blur
    binary: Blur
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos: [windows]
    goarch: [amd64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

  # Console-subsystem MCP companion for Claude; refuses to run without `mcp`.
  - id: blur-windows-mcp
    main: ./cmd/blur
    binary: blur-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos: [windows]
    goarch: [amd64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.mcpOnlyBinary=true -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: linux
    ids: [blur-linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - src: assets/blur.svg
        strip_parent: true
  - id: windows
    ids: [blur-windows, blur-windows-mcp]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless signing of the checksum file via GitHub OIDC (needs id-token: write).
# Verify with: cosign verify-blob --bundle checksums.txt.sigstore.json ...
signs:
  - id: cosign-checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  header: |
    ## Blur {{ .Tag }}

    Private, local-first memory for you.

    Memory is stored locally and encrypted. AI, folder sync and MCP are optional;
    configured remote providers and MCP clients may receive selected content.
  footer: |
    ---

    **Downloads:** Windows x86-64 (`windows_amd64.zip`), Linux x86-64 (`linux_amd64.tar.gz`) and Linux ARM64 (`linux_arm64.tar.gz`). Windows and Linux builds are experimental.

    **macOS:** when repository signing and notarization secrets are configured, a separate job attaches `Blur_{{ .Version }}_macos_universal.zip` (Developer ID signed, notarized, universal Apple silicon + Intel). If that asset is absent, use the source build instructions in the setup guide.

    **Setup:** https://github.com/hazcod/blur/blob/{{ .Tag }}/docs/getting-started.md

    **Verify:** `sha256sum -c checksums.txt` and
    `cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp 'https://github.com/hazcod/blur/' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`
  prerelease: auto
