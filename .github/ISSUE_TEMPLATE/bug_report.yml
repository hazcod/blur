name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include captured content, credentials, or personal data.
        For security issues use the private advisory link instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Blur version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS version and desktop environment
      description: Include CPU architecture. On Linux, include desktop, X11 or Wayland session, and keyring provider. On Windows, note whether the affected app is elevated.
      placeholder: e.g. Windows 11, x86-64; affected app runs without elevation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Relevant startup or capture errors, redacted of personal data. On Windows, logs are under %APPDATA%\Blur\Logs. Do not attach your memory database, captured text, credentials or keyring data. The fixture-only doctor command is not a diagnostic tool for your personal store.
      render: shell
